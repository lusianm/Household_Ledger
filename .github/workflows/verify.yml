name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/read-version.ps1
          $v = Get-ChagokVersion
          "tag=$($v.Tag)" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $v.Tag) { throw "Tag must match pubspec.yaml: $($v.Tag)" }
            $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
            $previous = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable status
            if ($status -eq 200) {
              $m = [regex]::Match($previous.tag_name, '^v(\d+\.\d+\.\d+)\+(\d+)$')
              if (-not $m.Success) { throw 'Previous release uses an unsupported version format.' }
              if ($v.Build -le [int]$m.Groups[2].Value -or [version]$v.Version -lt [version]$m.Groups[1].Value) { throw 'Release version must not decrease and build number must increase.' }
            } elseif ($status -ne 404) { throw "Cannot verify previous release ($status)." }
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Build test APK
        if: github.ref_type != 'tag'
        run: flutter build apk --debug
      - name: Prepare release configuration
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GOOGLE_ANDROID_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_SERVER_CLIENT_ID }}
        run: |
          $required = 'ANDROID_KEYSTORE_BASE64','ANDROID_STORE_PASSWORD','ANDROID_KEY_PASSWORD','ANDROID_KEY_ALIAS','GOOGLE_ANDROID_SERVER_CLIENT_ID'
          foreach ($name in $required) { if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing release secret: $name" } }
          $keyPath = Join-Path $env:RUNNER_TEMP 'chagok-release.jks'
          [IO.File]::WriteAllBytes($keyPath,[Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          function EscapeProperty([string]$value) {
            -join ($value.ToCharArray() | ForEach-Object { '\u{0:x4}' -f [int]$_ })
          }
          @("storeFile=$(EscapeProperty $keyPath)","storePassword=$(EscapeProperty $env:ANDROID_STORE_PASSWORD)","keyAlias=$(EscapeProperty $env:ANDROID_KEY_ALIAS)","keyPassword=$(EscapeProperty $env:ANDROID_KEY_PASSWORD)") | Set-Content android/key.properties -Encoding ascii
          @{GOOGLE_ANDROID_SERVER_CLIENT_ID=$env:GOOGLE_ANDROID_SERVER_CLIENT_ID;UPDATE_REPOSITORY=$env:GITHUB_REPOSITORY} | ConvertTo-Json | Set-Content config.local.json -Encoding utf8
      - name: Build signed release APK
        if: github.ref_type == 'tag'
        run: |
          flutter build apk --release --dart-define-from-file=config.local.json
          mkdir -p build/dist
          cp build/app/outputs/flutter-apk/app-release.apk build/dist/chagok-android.apk
          cd build/dist
          sha256sum chagok-android.apk > chagok-android.apk.sha256
      - name: Remove signing material
        if: always() && github.ref_type == 'tag'
        shell: pwsh
        run: |
          @('android/key.properties','config.local.json',(Join-Path $env:RUNNER_TEMP 'chagok-release.jks')) | ForEach-Object { if (Test-Path -LiteralPath $_) { Remove-Item -LiteralPath $_ -Force } }
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: chagok-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: chagok-android-release
          path: build/dist/chagok-android.apk*
          if-no-files-found: error
  windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Prepare release configuration
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_DESKTOP_CLIENT_ID -or -not $env:GOOGLE_DESKTOP_CLIENT_SECRET) { throw 'Configure desktop OAuth secrets before creating a release tag.' }
          @{GOOGLE_DESKTOP_CLIENT_ID=$env:GOOGLE_DESKTOP_CLIENT_ID;GOOGLE_DESKTOP_CLIENT_SECRET=$env:GOOGLE_DESKTOP_CLIENT_SECRET} | ConvertTo-Json | Set-Content config.local.json -Encoding utf8
      - name: Build Windows installation EXE on GitHub
        run: ./scripts/package-windows.ps1
      - name: Remove local configuration
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath config.local.json) { Remove-Item -LiteralPath config.local.json -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: chagok-windows-installer
          path: |
            build/dist/chagok-windows-setup.exe
            build/dist/chagok-windows-setup.exe.sha256
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: [verify, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chagok-*-release
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: chagok-windows-installer
          path: release
      - name: Create or update release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(jq -r .isDraft release-state.json)" = true || { echo 'Published releases are immutable in this workflow.'; exit 1; }
          else
            printf 'Windows: download chagok-windows-setup.exe. Android: download chagok-android.apk.\nReview this build and edit the release notes before publishing.\n' > release-notes.md
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber

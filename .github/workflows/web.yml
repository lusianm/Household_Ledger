name: Verify and deploy web app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: node scripts/prepare-web.mjs
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: dart test --platform chrome test/browser/wasm_test.dart
        timeout-minutes: 3
      - run: node --test test/web_storage_test.mjs
      - run: python3 -m unittest discover -s test -p ledger_connect_test.py
      - name: Build for GitHub Pages
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_PATH="/$REPO_NAME/"
          if [[ "$REPO_NAME" == *.github.io ]]; then BASE_PATH="/"; fi
          flutter build web --release --no-web-resources-cdn --pwa-strategy=none --base-href "$BASE_PATH" --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
          node scripts/package-web.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

